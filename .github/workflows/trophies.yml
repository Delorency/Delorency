name: Generate Trophies

on:
  schedule:
    - cron: "0 6 * * *" # Запускать раз в день
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          file: images/trophy.svg
          theme: tokyonight
          max-rows: 1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/trophy.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update trophy SVG"
            git push
          fi
