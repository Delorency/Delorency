name: Generate Achievements Card

on:
  schedule:
    - cron: "0 6 * * *" # Запускать раз в день
  workflow_dispatch:

permissions:
  contents: write # Нужно для сохранения сгенерированного SVG-файла

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate achievements card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TROPHY_TOKEN }} # Ваш PAT, который вы создали
          filename: images/achievements.svg
          user: Delorency
          template: classic
          base: "" # Оставляем пустым, чтобы генерировать только плагин
          config_timezone: Europe/Moscow
          
          # --- Настройки плагина Achievements ---
          plugin_achievements: yes
          plugin_achievements_threshold: C # Показывать достижения ранга C и выше
          plugin_achievements_secrets: yes # Показывать секретные достижения
          plugin_achievements_display: compact # Компактный вид (можно заменить на detailed)
          plugin_achievements_limit: 0 # Показать все разблокированные достижения
