name: Generate Trophies

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate trophy SVG
        uses: soulteary/github-profile-trophy-action@v1
        with:
          token: ${{ secrets.TROPHY_TOKEN }} # Требуется PAT
          path: images/trophy.svg
          options: "username=${{ github.repository_owner }}&theme=tokyonight&max-rows=1"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/trophy.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update trophy SVG"
            git push
          fi
